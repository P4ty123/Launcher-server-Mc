name: Anteprima (screenshot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compila
        shell: cmd
        run: COMPILA.bat

      - name: Installa un server Paper di prova
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\MineServerManager.exe -ArgumentList '--selftest-e2e','Paper','e2e.txt' -PassThru
          $null = $p.Handle
          $null = $p.WaitForExit(1200000)
          Get-Content e2e.txt -Encoding utf8

      - name: Screenshot di tutte le schede
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\MineServerManager.exe -ArgumentList '--screenshots','anteprima' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(600000)) { $p.Kill(); exit 1 }
          Get-ChildItem anteprima

      - name: Salva gli screenshot nel repository (docs/anteprima)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs\anteprima | Out-Null
          Copy-Item anteprima\*.png docs\anteprima\ -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/anteprima/*.png
          git commit -m "Anteprima aggiornata [skip ci]"
          git push
          exit 0
